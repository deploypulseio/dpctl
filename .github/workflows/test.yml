name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22.12.0", "24"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - run: npm install
        working-directory: test/resources/TestApp

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report
          path: test/resources/TestApp/mochawesome-report/
